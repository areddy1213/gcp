# This rule is not used by the project warm-pool-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the takehome.replit.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: warm-pool-controller
    app.kubernetes.io/managed-by: kustomize
  name: workerclaim-editor-role
rules:
- apiGroups:
  - takehome.replit.com
  resources:
  - workerclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - takehome.replit.com
  resources:
  - workerclaims/status
  verbs:
  - get
