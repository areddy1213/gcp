---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - takehome.replit.com
  resources:
  - workerclaims
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - takehome.replit.com
  resources:
  - workerclaims/finalizers
  - workerpools/finalizers
  verbs:
  - update
- apiGroups:
  - takehome.replit.com
  resources:
  - workerclaims/status
  - workerpools/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - takehome.replit.com
  resources:
  - workerpools
  verbs:
  - get
  - list
  - watch
