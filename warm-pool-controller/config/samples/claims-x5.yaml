  name: claim-2
spec:
  poolName: default
---
apiVersion: takehome.replit.com/v1alpha1
kind: WorkerClaim
metadata:
  name: claim-3
spec:
  poolName: default
---
apiVersion: takehome.replit.com/v1alpha1
kind: WorkerClaim
metadata:
  name: claim-4
spec:
  poolName: default
---
apiVersion: takehome.replit.com/v1alpha1
kind: WorkerClaim
metadata:
  name: claim-5
spec:
  poolName: default
