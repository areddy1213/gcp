---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: workerclaims.takehome.replit.com
spec:
  group: takehome.replit.com
  names:
    kind: WorkerClaim
    listKind: WorkerClaimList
    plural: workerclaims
    shortNames:
    - wc
    singular: workerclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolName
      name: Pool
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.podName
      name: Pod
      type: string
    - jsonPath: .status.podIP
      name: IP
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WorkerClaim asks for one ready Pod from a WorkerPool.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WorkerClaim
            properties:
              poolName:
                description: |-
                  poolName is the WorkerPool, in the claim's namespace, to take a Pod from.
                  It cannot be changed after creation.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: poolName is immutable
                  rule: self == oldSelf
            required:
            - poolName
            type: object
          status:
            description: status defines the observed state of WorkerClaim
            properties:
              assignedAt:
                description: |-
                  assignedAt is when the current Pod was assigned (copied from the Pod's
                  takehome.replit.com/claimed-at annotation).
                format: date-time
                type: string
              attempts:
                description: |-
                  attempts counts the Pods assigned over the claim's life. A value above 1
                  means earlier Pods were lost. It is informational only.
                format: int32
                type: integer
              message:
                description: message is a human-readable explanation of the phase.
                type: string
              phase:
                description: phase is Pending or Claimed.
                enum:
                - Pending
                - Claimed
                type: string
              podIP:
                description: podIP is the assigned Pod's IP.
                type: string
              podName:
                description: |-
                  podName is the assigned Pod. It can change: if the Pod is lost, the claim
                  goes back to Pending and is later assigned a different Pod.
                type: string
              reason:
                description: |-
                  reason is a machine-readable explanation of the phase:
                  Assigned, NoWarmPodsAvailable, PoolNotFound or AssignedPodLost.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be at most 63 characters (it is used as a label value)
          rule: size(self.metadata.name) <= 63
    served: true
    storage: true
    subresources:
      status: {}
