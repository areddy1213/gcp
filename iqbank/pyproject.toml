[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iqbank"
version = "0.1.0"
description = "Collect, extract, dedupe and report interview questions for a target company and role."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.4,<3",
  "praw>=7.7",
  "httpx>=0.27",
  "trafilatura>=2.0",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
iqbank = "iqbank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
